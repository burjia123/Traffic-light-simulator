<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Light Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .light-off { opacity: 0.12; filter: grayscale(100%); }
    .light-red { background-color: #ff3b30; box-shadow: 0 0 40px #ff3b30, 0 0 80px #ff3b30; }
    .light-yellow { background-color: #ffcc00; box-shadow: 0 0 40px #ffcc00, 0 0 80px #ffcc00; }
    .light-green { background-color: #34c759; box-shadow: 0 0 40px #34c759, 0 0 80px #34c759; }
    select, input { background-color: #1c2333; color: white; border: 1px solid #374151; }
  </style>
</head>
<body class="text-gray-100 min-h-screen p-4 flex flex-col items-center">

  <header class="w-full max-w-md flex justify-between items-center py-4 mb-2">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Traffic Control</h1>
      <p id="live-clock" class="text-xs text-gray-400 font-mono mt-1">Clock: 00:00:00 AM</p>
    </div>
    <button onclick="toggleGlobalPower()" id="global-power-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-sm shadow-lg transition">
      ALL ON
    </button>
  </header>

  <!-- 4 Light Grid -->
  <main class="w-full max-w-md grid grid-cols-2 gap-4" id="lights-container"></main>

  <!-- Modal Settings -->
  <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h3 id="modal-title" class="text-xl font-bold text-white">Light # Settings</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
      </div>

      <div class="space-y-4">
        <!-- iOS Compatible Time Selector (Hours, Minutes, Seconds) -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Start Time (HH : MM : SS)</label>
          <div class="grid grid-cols-4 gap-2">
            <select id="cfg-hr" class="p-2.5 rounded-xl text-center font-mono text-base font-bold"></select>
            <select id="cfg-min" class="p-2.5 rounded-xl text-center font-mono text-base font-bold"></select>
            <select id="cfg-sec" class="p-2.5 rounded-xl text-center font-mono text-base font-bold"></select>
            <select id="cfg-ampm" class="p-2.5 rounded-xl text-center font-mono text-base font-bold">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Initial Color at Start Time</label>
          <select id="cfg-start-phase" class="w-full p-3 rounded-xl font-bold">
            <option value="green">Green Light</option>
            <option value="yellow">Yellow/Orange Light</option>
            <option value="red">Red Light</option>
          </select>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-emerald-400 font-bold mb-1">Green (s)</label>
            <input type="number" id="cfg-dur-green" min="1" class="w-full p-2.5 rounded-xl text-center font-mono text-lg font-bold" />
          </div>
          <div>
            <label class="block text-xs text-amber-400 font-bold mb-1">Yellow (s)</label>
            <input type="number" id="cfg-dur-yellow" min="1" class="w-full p-2.5 rounded-xl text-center font-mono text-lg font-bold" />
          </div>
          <div>
            <label class="block text-xs text-rose-400 font-bold mb-1">Red (s)</label>
            <input type="number" id="cfg-dur-red" min="1" class="w-full p-2.5 rounded-xl text-center font-mono text-lg font-bold" />
          </div>
        </div>
      </div>

      <div class="mt-8 flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-3 bg-gray-800 hover:bg-gray-700 font-bold rounded-xl text-gray-300">Cancel</button>
        <button onclick="saveModalSettings()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-white shadow-lg">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_CONFIGS = [
      { id: 1, enabled: true, startHr: 12, startMin: 0, startSec: 0, startAmPm: 'PM', startPhase: 'green', greenDur: 60, yellowDur: 5, redDur: 60 },
      { id: 2, enabled: true, startHr: 12, startMin: 0, startSec: 0, startAmPm: 'PM', startPhase: 'green', greenDur: 45, yellowDur: 5, redDur: 45 },
      { id: 3, enabled: true, startHr: 12, startMin: 0, startSec: 0, startAmPm: 'PM', startPhase: 'red',   greenDur: 60, yellowDur: 5, redDur: 60 },
      { id: 4, enabled: true, startHr: 12, startMin: 0, startSec: 0, startAmPm: 'PM', startPhase: 'green', greenDur: 30, yellowDur: 3, redDur: 30 }
    ];

    let lights = JSON.parse(localStorage.getItem('traffic_lights_cfg_v2')) || DEFAULT_CONFIGS;
    let activeModalIndex = null;

    function populateSelects() {
      const hrSel = document.getElementById('cfg-hr');
      const minSel = document.getElementById('cfg-min');
      const secSel = document.getElementById('cfg-sec');

      hrSel.innerHTML = ''; minSel.innerHTML = ''; secSel.innerHTML = '';

      for (let i = 1; i <= 12; i++) {
        hrSel.innerHTML += `<option value="${i}">${i}</option>`;
      }
      for (let i = 0; i < 60; i++) {
        const val = i.toString().padStart(2, '0');
        minSel.innerHTML += `<option value="${i}">${val}</option>`;
        secSel.innerHTML += `<option value="${i}">${val}</option>`;
      }
    }

    function saveState() {
      localStorage.setItem('traffic_lights_cfg_v2', JSON.stringify(lights));
    }

    function renderCards() {
      const container = document.getElementById('lights-container');
      container.innerHTML = '';

      lights.forEach((light, idx) => {
        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 rounded-3xl p-4 flex flex-col items-center relative shadow-xl";
        card.innerHTML = `
          <div class="w-full flex justify-between items-center mb-3">
            <span class="font-black text-sm text-gray-400">LIGHT ${light.id}</span>
            <div class="flex items-center gap-2">
              <button onclick="openModal(${idx})" class="text-gray-400 hover:text-white p-1">
                ⚙️
              </button>
              <input type="checkbox" ${light.enabled ? 'checked' : ''} onchange="toggleLight(${idx})" class="w-5 h-5 accent-blue-500 rounded cursor-pointer" />
            </div>
          </div>

          <!-- Light Box -->
          <div class="bg-black/90 p-3 rounded-2xl flex flex-col gap-3 border border-gray-800 shadow-inner my-2">
            <div id="light-${idx}-red" class="w-12 h-12 rounded-full light-off transition-all duration-300"></div>
            <div id="light-${idx}-yellow" class="w-12 h-12 rounded-full light-off transition-all duration-300"></div>
            <div id="light-${idx}-green" class="w-12 h-12 rounded-full light-off transition-all duration-300"></div>
          </div>

          <!-- Giant Timer Display -->
          <div id="timer-${idx}" class="text-5xl font-extrabold font-mono tracking-tight text-white mt-3 mb-1">
            00
          </div>
        `;
        container.appendChild(card);
      });
    }

    function getStartTimeMs(light, now) {
      let hr = parseInt(light.startHr, 10);
      if (light.startAmPm === 'PM' && hr < 12) hr += 12;
      if (light.startAmPm === 'AM' && hr === 12) hr = 0;

      const startTime = new Date(now);
      startTime.setHours(hr, parseInt(light.startMin, 10), parseInt(light.startSec, 10), 0);
      return startTime.getTime();
    }

    function tick() {
      const now = new Date();
      document.getElementById('live-clock').innerText = 'Clock: ' + now.toLocaleTimeString();

      lights.forEach((light, idx) => {
        const redEl = document.getElementById(`light-${idx}-red`);
        const yellowEl = document.getElementById(`light-${idx}-yellow`);
        const greenEl = document.getElementById(`light-${idx}-green`);
        const timerEl = document.getElementById(`timer-${idx}`);

        if (!light.enabled) {
          redEl.className = 'w-12 h-12 rounded-full light-off';
          yellowEl.className = 'w-12 h-12 rounded-full light-off';
          greenEl.className = 'w-12 h-12 rounded-full light-off';
          timerEl.innerText = '--';
          return;
        }

        const startMs = getStartTimeMs(light, now);
        const greenD = parseInt(light.greenDur, 10) || 1;
        const yellowD = parseInt(light.yellowDur, 10) || 1;
        const redD = parseInt(light.redDur, 10) || 1;
        const cycleTotalSec = greenD + yellowD + redD;

        let diffSec = Math.floor((now.getTime() - startMs) / 1000);
        let cycleOffset = diffSec % cycleTotalSec;
        if (cycleOffset < 0) cycleOffset += cycleTotalSec;

        // Determine offset based on initial phase
        let phaseShift = 0;
        if (light.startPhase === 'yellow') phaseShift = greenD;
        if (light.startPhase === 'red') phaseShift = greenD + yellowD;

        const effectiveOffset = (cycleOffset + phaseShift) % cycleTotalSec;

        let activeColor = '';
        let remaining = 0;

        if (effectiveOffset < greenD) {
          activeColor = 'green';
          remaining = greenD - effectiveOffset;
        } else if (effectiveOffset < greenD + yellowD) {
          activeColor = 'yellow';
          remaining = (greenD + yellowD) - effectiveOffset;
        } else {
          activeColor = 'red';
          remaining = cycleTotalSec - effectiveOffset;
        }

        redEl.className = 'w-12 h-12 rounded-full ' + (activeColor === 'red' ? 'light-red' : 'light-off');
        yellowEl.className = 'w-12 h-12 rounded-full ' + (activeColor === 'yellow' ? 'light-yellow' : 'light-off');
        greenEl.className = 'w-12 h-12 rounded-full ' + (activeColor === 'green' ? 'light-green' : 'light-off');

        timerEl.innerText = remaining.toString().padStart(2, '0');
      });
    }

    function toggleLight(idx) {
      lights[idx].enabled = !lights[idx].enabled;
      saveState();
    }

    function toggleGlobalPower() {
      const anyOn = lights.some(l => l.enabled);
      lights.forEach(l => l.enabled = !anyOn);
      document.getElementById('global-power-btn').innerText = anyOn ? 'ALL ON' : 'ALL OFF';
      saveState();
      renderCards();
    }

    function openModal(idx) {
      activeModalIndex = idx;
      const l = lights[idx];
      document.getElementById('modal-title').innerText = `Light #${l.id} Settings`;
      document.getElementById('cfg-hr').value = l.startHr;
      document.getElementById('cfg-min').value = l.startMin;
      document.getElementById('cfg-sec').value = l.startSec;
      document.getElementById('cfg-ampm').value = l.startAmPm;
      document.getElementById('cfg-start-phase').value = l.startPhase || 'green';
      document.getElementById('cfg-dur-green').value = l.greenDur;
      document.getElementById('cfg-dur-yellow').value = l.yellowDur;
      document.getElementById('cfg-dur-red').value = l.redDur;
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('settings-modal').classList.add('hidden');
      activeModalIndex = null;
    }

    function saveModalSettings() {
      if (activeModalIndex === null) return;
      const l = lights[activeModalIndex];
      l.startHr = parseInt(document.getElementById('cfg-hr').value, 10);
      l.startMin = parseInt(document.getElementById('cfg-min').value, 10);
      l.startSec = parseInt(document.getElementById('cfg-sec').value, 10);
      l.startAmPm = document.getElementById('cfg-ampm').value;
      l.startPhase = document.getElementById('cfg-start-phase').value;
      l.greenDur = parseInt(document.getElementById('cfg-dur-green').value, 10) || 1;
      l.yellowDur = parseInt(document.getElementById('cfg-dur-yellow').value, 10) || 1;
      l.redDur = parseInt(document.getElementById('cfg-dur-red').value, 10) || 1;

      saveState();
      closeModal();
      tick();
    }

    populateSelects();
    renderCards();
    setInterval(tick, 200);
    tick();
  </script>
