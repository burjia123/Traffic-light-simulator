<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone Traffic Light Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        iosBg: '#000000',
                        iosCard: '#1c1c1e',
                        iosSubCard: '#2c2c2e',
                        iosRed: '#ff453a',
                        iosYellow: '#ffd60a',
                        iosGreen: '#30d158',
                        iosBlue: '#0a84ff',
                    }
                }
            }
        }
    </script>
    <style>
        /* Traffic Light Bulb Glow Effects */
        .light-red {
            background-color: #2b0808;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
            transition: all 0.25s ease-in-out;
        }
        .light-red.active {
            background-color: #ff3b30;
            box-shadow: 0 0 25px #ff3b30, 0 0 45px rgba(255, 59, 48, 0.7), inset 0 0 10px #ffffff;
        }

        .light-yellow {
            background-color: #2e2600;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
            transition: all 0.25s ease-in-out;
        }
        .light-yellow.active {
            background-color: #ffcc00;
            box-shadow: 0 0 25px #ffcc00, 0 0 45px rgba(255, 204, 0, 0.7), inset 0 0 10px #ffffff;
        }

        .light-green {
            background-color: #04240a;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
            transition: all 0.25s ease-in-out;
        }
        .light-green.active {
            background-color: #34c759;
            box-shadow: 0 0 25px #34c759, 0 0 45px rgba(52, 199, 89, 0.7), inset 0 0 10px #ffffff;
        }

        /* Custom Scrollbar for Settings Modal */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 4px; }

        /* iOS Toggle Switch Styling */
        .ios-toggle:checked + .ios-toggle-bg { background-color: #34c759; }
        .ios-toggle:checked + .ios-toggle-bg .ios-toggle-dot { transform: translateX(20px); }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-0 md:p-6 font-sans antialiased selection:bg-iosBlue selection:text-white">

<div id="phone-wrapper" class="w-full max-w-md h-screen md:h-[880px] bg-black md:rounded-[50px] shadow-2xl border-0 md:border-[10px] border-gray-800 flex flex-col relative overflow-hidden transition-all duration-300">
    
    <!-- iPhone Dynamic Island / Notch Header -->
    <div class="hidden md:flex justify-center pt-3 pb-1 absolute top-0 left-0 right-0 z-50 pointer-events-none">
        <div class="w-32 h-6 bg-black rounded-full flex items-center justify-between px-3 border border-gray-900">
            <div class="w-2.5 h-2.5 rounded-full bg-gray-900"></div>
            <div class="w-3 h-3 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center">
                <div class="w-1 h-1 rounded-full bg-blue-900/50"></div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="pt-2 md:pt-8 px-6 pb-2 flex justify-between items-center text-xs text-gray-400 select-none z-40 bg-black/80 backdrop-blur-md">
        <span id="ios-time" class="font-semibold text-white tracking-wide">12:00 PM</span>
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-signal text-[10px]"></i>
            <i class="fa-solid fa-wifi text-[10px]"></i>
            <i class="fa-solid fa-battery-full text-xs text-white"></i>
        </div>
    </div>

    <!-- Header Control Bar -->
    <header class="px-5 py-3 border-b border-gray-800/80 flex items-center justify-between bg-black/80 backdrop-blur-md z-40">
        <div>
            <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                <i class="fa-solid fa-traffic-light text-iosYellow"></i> Traffic Light Signals
            </h1>
            <p class="text-[10px] text-gray-400">Wall-Clock Synchronized</p>
        </div>
        <div class="flex items-center gap-2">
            <button id="global-power-btn" onclick="toggleAllPower()" class="px-3 py-1.5 rounded-full bg-iosGreen/20 text-iosGreen text-xs font-semibold hover:bg-iosGreen/30 transition border border-iosGreen/30 flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-power-off"></i> <span id="global-power-text">All On</span>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-3.5 py-3 space-y-3 pb-12">
        <!-- Live Clock Sync Status -->
        <div class="bg-iosCard p-3 rounded-2xl border border-gray-800/80 flex items-center justify-between text-xs">
            <span class="text-gray-400 font-medium flex items-center gap-1.5">
                <i class="fa-regular fa-clock text-iosBlue"></i> System Clock Time:
            </span>
            <span class="font-mono text-iosBlue font-bold text-sm" id="system-time-display">00:00:00 AM</span>
        </div>

        <!-- 2x2 Grid of Traffic Light Cards -->
        <div class="grid grid-cols-2 gap-3" id="lights-grid">
            <!-- Dynamic Traffic Light Cards injected here -->
        </div>
    </main>

    <div id="settings-modal" class="absolute inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex-col justify-end transition-opacity duration-300">
        <div class="bg-iosCard border-t border-gray-700/80 rounded-t-[32px] p-5 w-full max-h-[88vh] overflow-y-auto shadow-2xl space-y-4">
            
            <div class="flex flex-col items-center gap-2">
                <div class="w-10 h-1 bg-gray-600 rounded-full"></div>
                <div class="w-full flex items-center justify-between mt-1">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-iosBlue"></div>
                        <h2 id="modal-title" class="text-base font-bold text-white">Configure Light #1</h2>
                    </div>
                    <button onclick="closeSettingsModal()" class="w-7 h-7 rounded-full bg-iosSubCard flex items-center justify-center text-gray-400 hover:text-white">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
            </div>

            <hr class="border-gray-800">

            <form id="settings-form" onsubmit="saveLightSettings(event)" class="space-y-3">
                <input type="hidden" id="modal-light-id">

                <!-- Light Enable Toggle -->
                <div class="flex items-center justify-between p-3 rounded-xl bg-iosSubCard">
                    <span class="text-xs font-medium text-gray-200 flex items-center gap-2">
                        <i class="fa-solid fa-power-off text-iosGreen"></i> Enable Light
                    </span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="modal-enabled" class="sr-only ios-toggle">
                        <div class="w-11 h-6 bg-gray-700 rounded-full ios-toggle-bg transition-colors duration-200">
                            <div class="w-5 h-5 bg-white rounded-full ios-toggle-dot transition-transform duration-200 transform translate-x-0.5 translate-y-0.5 shadow-md"></div>
                        </div>
                    </label>
                </div>

                <!-- Clock Reference Start Time -->
                <div class="p-3 rounded-xl bg-iosSubCard space-y-2">
                    <label class="text-xs font-medium text-gray-200 flex items-center gap-2">
                        <i class="fa-regular fa-clock text-iosBlue"></i> Reference Start Time (Phone Clock)
                    </label>
                    <input type="time" id="input-start-time" step="1" required
                           class="bg-gray-800 border border-gray-700 text-white text-xs rounded-xl p-2.5 w-full focus:outline-none focus:border-iosBlue font-mono">
                    <p class="text-[10px] text-gray-400">Light cycles synchronize relative to this clock reference (e.g. 12:00:00 PM).</p>
                </div>

                <!-- First Color Sequence -->
                <div class="p-3 rounded-xl bg-iosSubCard space-y-2">
                    <label class="text-xs font-medium text-gray-200 flex items-center gap-2">
                        <i class="fa-solid fa-play text-iosGreen"></i> Starting Color at Start Time
                    </label>
                    <select id="input-start-color" class="bg-gray-800 border border-gray-700 text-white text-xs rounded-xl p-2.5 w-full focus:outline-none focus:border-iosBlue">
                        <option value="GREEN">Green (Green ➔ Yellow ➔ Red)</option>
                        <option value="YELLOW">Yellow (Yellow ➔ Red ➔ Green)</option>
                        <option value="RED">Red (Red ➔ Green ➔ Yellow)</option>
                    </select>
                </div>

                <!-- Color Phase Durations -->
                <div class="p-3 rounded-xl bg-iosSubCard space-y-2.5">
                    <span class="text-xs font-medium text-gray-200 block">Phase Durations (Seconds)</span>
                    
                    <div class="flex items-center justify-between gap-3">
                        <span class="text-xs text-iosGreen font-semibold flex items-center gap-1.5 w-24">
                            <i class="fa-solid fa-circle text-[10px]"></i> Green
                        </span>
                        <input type="number" id="input-green" min="1" max="3600" required
                               class="bg-gray-800 border border-gray-700 text-white text-xs rounded-lg px-3 py-1.5 w-28 text-right focus:outline-none focus:border-iosGreen font-mono">
                    </div>

                    <div class="flex items-center justify-between gap-3">
                        <span class="text-xs text-iosYellow font-semibold flex items-center gap-1.5 w-24">
                            <i class="fa-solid fa-circle text-[10px]"></i> Yellow
                        </span>
                        <input type="number" id="input-yellow" min="1" max="600" required
                               class="bg-gray-800 border border-gray-700 text-white text-xs rounded-lg px-3 py-1.5 w-28 text-right focus:outline-none focus:border-iosYellow font-mono">
                    </div>

                    <div class="flex items-center justify-between gap-3">
                        <span class="text-xs text-iosRed font-semibold flex items-center gap-1.5 w-24">
                            <i class="fa-solid fa-circle text-[10px]"></i> Red
                        </span>
                        <input type="number" id="input-red" min="1" max="3600" required
                               class="bg-gray-800 border border-gray-700 text-white text-xs rounded-lg px-3 py-1.5 w-28 text-right focus:outline-none focus:border-iosRed font-mono">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeSettingsModal()" 
                            class="w-1/2 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-300 transition">
                        Cancel
                    </button>
                    <button type="submit" 
                            class="w-1/2 py-2.5 rounded-xl bg-iosBlue hover:bg-blue-600 text-xs font-semibold text-white transition shadow-lg shadow-blue-500/20">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Home Indicator Bar -->
    <div class="pb-2 pt-1 flex justify-center bg-black/80 backdrop-blur-md">
        <div class="w-32 h-1 bg-gray-600 rounded-full"></div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'iphone_traffic_lights_config_v4';
    
    // Default initial configuration for the 4 traffic lights
    const defaultConfig = [
        { id: 1, name: "Traffic Light 1", enabled: true, startTime: "12:00:00", startColor: "GREEN", greenDuration: 60, yellowDuration: 30, redDuration: 90 },
        { id: 2, name: "Traffic Light 2", enabled: true, startTime: "12:00:00", startColor: "RED", greenDuration: 60, yellowDuration: 30, redDuration: 90 },
        { id: 3, name: "Traffic Light 3", enabled: true, startTime: "12:00:00", startColor: "GREEN", greenDuration: 45, yellowDuration: 15, redDuration: 60 },
        { id: 4, name: "Traffic Light 4", enabled: true, startTime: "12:00:00", startColor: "RED", greenDuration: 45, yellowDuration: 15, redDuration: 60 }
    ];

    let lightsConfig = [];

    // Load persisted state or fallback to defaults
    function loadState() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                lightsConfig = JSON.parse(saved);
            } else {
                lightsConfig = JSON.parse(JSON.stringify(defaultConfig));
            }
        } catch (e) {
            console.error("Failed to load local storage state", e);
            lightsConfig = JSON.parse(JSON.stringify(defaultConfig));
        }
    }

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(lightsConfig));
        } catch (e) {
            console.error("Failed to save state to localStorage", e);
        }
    }

    // Render traffic light UI cards
    function renderLightCards() {
        const grid = document.getElementById('lights-grid');
        grid.innerHTML = '';

        lightsConfig.forEach(light => {
            const card = document.createElement('div');
            card.className = "bg-iosCard border border-gray-800/80 rounded-2xl p-3 flex flex-col justify-between shadow-lg relative overflow-hidden";
            card.id = `light-card-${light.id}`;

            card.innerHTML = `
                <!-- Card Header -->
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-gray-200 truncate">${light.name}</span>
                    <button onclick="openSettingsModal(${light.id})" class="text-gray-400 hover:text-iosBlue p-1 transition">
                        <i class="fa-solid fa-gear text-xs"></i>
                    </button>
                </div>

                <!-- Traffic Light Housing -->
                <div class="bg-black/90 p-2.5 rounded-2xl border border-gray-800/90 flex flex-col items-center justify-center gap-2 self-center w-20 shadow-inner">
                    <div id="bulb-red-${light.id}" class="w-9 h-9 rounded-full light-red flex items-center justify-center">
                        <span class="text-[9px] font-bold text-black/40 select-none">R</span>
                    </div>
                    <div id="bulb-yellow-${light.id}" class="w-9 h-9 rounded-full light-yellow flex items-center justify-center">
                        <span class="text-[9px] font-bold text-black/40 select-none">Y</span>
                    </div>
                    <div id="bulb-green-${light.id}" class="w-9 h-9 rounded-full light-green flex items-center justify-center">
                        <span class="text-[9px] font-bold text-black/40 select-none">G</span>
                    </div>
                </div>

                <!-- 4x Enlarged Timer Display (Only Huge Clock Text) -->
                <div class="mt-3 bg-black/40 rounded-xl p-2 text-center border border-gray-800/60 flex items-center justify-center min-h-[64px]">
                    <div id="timer-text-${light.id}" class="text-4xl sm:text-5xl font-mono font-black text-white tracking-tight leading-none py-1">
                        --:--
                    </div>
                </div>

                <!-- Power Switch -->
                <div class="mt-2.5 pt-2 border-t border-gray-800/80 flex items-center justify-between px-1">
                    <span class="text-[10px] text-gray-400 font-medium">Power</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" ${light.enabled ? 'checked' : ''} onchange="toggleLightPower(${light.id}, this.checked)" class="sr-only ios-toggle">
                        <div class="w-7 h-4 bg-gray-700 rounded-full ios-toggle-bg transition-colors duration-200">
                            <div class="w-3 h-3 bg-white rounded-full ios-toggle-dot transition-transform duration-200 transform translate-x-0.5 translate-y-0.5 shadow-sm"></div>
                        </div>
                    </label>
                </div>
            `;
            grid.appendChild(card);
        });

        updateGlobalPowerButtonUI();
    }

    // Convert "HH:MM:SS" or "HH:MM" into milliseconds from today's midnight
    function getReferenceTimestampToday(timeStr) {
        const now = new Date();
        const parts = timeStr.split(':');
        const hours = parseInt(parts[0], 10) || 0;
        const minutes = parseInt(parts[1], 10) || 0;
        const seconds = parseInt(parts[2], 10) || 0;

        const ref = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, seconds, 0);
        return ref.getTime();
    }

    // Core Loop: Synchronize each light phase using wall-clock modulo math
    function updateSimulation() {
        const now = new Date();
        const nowMs = now.getTime();

        // Update Phone Header Clock
        document.getElementById('ios-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('system-time-display').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        lightsConfig.forEach(light => {
            const redBulb = document.getElementById(`bulb-red-${light.id}`);
            const yellowBulb = document.getElementById(`bulb-yellow-${light.id}`);
            const greenBulb = document.getElementById(`bulb-green-${light.id}`);
            const timerText = document.getElementById(`timer-text-${light.id}`);

            if (!redBulb || !timerText) return;

            // Handle Turned Off State
            if (!light.enabled) {
                redBulb.classList.remove('active');
                yellowBulb.classList.remove('active');
                greenBulb.classList.remove('active');
                timerText.innerText = "OFF";
                timerText.className = "text-3xl sm:text-4xl font-mono font-black text-gray-600 tracking-tight leading-none py-1 select-none";
                return;
            }

            // Total Cycle Time
            const totalCycleSec = light.greenDuration + light.yellowDuration + light.redDuration;
            const totalCycleMs = totalCycleSec * 1000;

            // Start Time epoch reference
            const refMs = getReferenceTimestampToday(light.startTime);

            // Compute elapsed offset using modulo math
            let elapsedMs = (nowMs - refMs) % totalCycleMs;
            if (elapsedMs < 0) {
                elapsedMs += totalCycleMs; // Account for times before reference point today
            }

            const elapsedSec = elapsedMs / 1000;

            // Phase Sequence Setup
            let phases = [];
            if (light.startColor === "GREEN") {
                phases = [
                    { name: "GREEN", duration: light.greenDuration, bulb: greenBulb, colorClass: "text-iosGreen" },
                    { name: "YELLOW", duration: light.yellowDuration, bulb: yellowBulb, colorClass: "text-iosYellow" },
                    { name: "RED", duration: light.redDuration, bulb: redBulb, colorClass: "text-iosRed" }
                ];
            } else if (light.startColor === "YELLOW") {
                phases = [
                    { name: "YELLOW", duration: light.yellowDuration, bulb: yellowBulb, colorClass: "text-iosYellow" },
                    { name: "RED", duration: light.redDuration, bulb: redBulb, colorClass: "text-iosRed" },
                    { name: "GREEN", duration: light.greenDuration, bulb: greenBulb, colorClass: "text-iosGreen" }
                ];
            } else {
                phases = [
                    { name: "RED", duration: light.redDuration, bulb: redBulb, colorClass: "text-iosRed" },
                    { name: "GREEN", duration: light.greenDuration, bulb: greenBulb, colorClass: "text-iosGreen" },
                    { name: "YELLOW", duration: light.yellowDuration, bulb: yellowBulb, colorClass: "text-iosYellow" }
                ];
            }

            // Find current phase and calculate remaining seconds
            let accumulatedSec = 0;
            let currentPhase = phases[0];
            let phaseRemainingSec = 0;

            for (let i = 0; i < phases.length; i++) {
                const phase = phases[i];
                if (elapsedSec >= accumulatedSec && elapsedSec < accumulatedSec + phase.duration) {
                    currentPhase = phase;
                    phaseRemainingSec = Math.ceil((accumulatedSec + phase.duration) - elapsedSec);
                    break;
                }
                accumulatedSec += phase.duration;
            }

            // Reset bulb glow states
            redBulb.classList.remove('active');
            yellowBulb.classList.remove('active');
            greenBulb.classList.remove('active');

            // Light up active phase bulb
            currentPhase.bulb.classList.add('active');

            // Format timer readout
            const mins = Math.floor(phaseRemainingSec / 60);
            const secs = phaseRemainingSec % 60;
            const timeFormatted = mins > 0 ? `${mins}:${secs < 10 ? '0' : ''}${secs}` : `${secs}s`;

            // Display ONLY the 4x enlarged countdown timer
            timerText.innerText = timeFormatted;
            timerText.className = `text-4xl sm:text-5xl font-mono font-black ${currentPhase.colorClass} tracking-tight leading-none py-1 select-none`;
        });
    }

    // Modal Control & Configuration Handlers
    function openSettingsModal(id) {
        const light = lightsConfig.find(l => l.id === id);
        if (!light) return;

        document.getElementById('modal-light-id').value = light.id;
        document.getElementById('modal-title').innerText = `Configure ${light.name}`;
        document.getElementById('modal-enabled').checked = light.enabled;
        
        // Ensure HH:MM:SS format for time picker
        let formattedTime = light.startTime;
        if (formattedTime.split(':').length === 2) formattedTime += ":00";
        document.getElementById('input-start-time').value = formattedTime;

        document.getElementById('input-start-color').value = light.startColor || "GREEN";
        document.getElementById('input-green').value = light.greenDuration;
        document.getElementById('input-yellow').value = light.yellowDuration;
        document.getElementById('input-red').value = light.redDuration;

        const modal = document.getElementById('settings-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeSettingsModal() {
        const modal = document.getElementById('settings-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function saveLightSettings(event) {
        event.preventDefault();
        const id = parseInt(document.getElementById('modal-light-id').value, 10);
        const light = lightsConfig.find(l => l.id === id);

        if (light) {
            light.enabled = document.getElementById('modal-enabled').checked;
            light.startTime = document.getElementById('input-start-time').value;
            light.startColor = document.getElementById('input-start-color').value;
            light.greenDuration = parseInt(document.getElementById('input-green').value, 10) || 10;
            light.yellowDuration = parseInt(document.getElementById('input-yellow').value, 10) || 5;
            light.redDuration = parseInt(document.getElementById('input-red').value, 10) || 10;

            saveState();
            renderLightCards();
            updateSimulation();
            closeSettingsModal();
        }
    }

    function toggleLightPower(id, enabled) {
        const light = lightsConfig.find(l => l.id === id);
        if (light) {
            light.enabled = enabled;
            saveState();
            updateSimulation();
            updateGlobalPowerButtonUI();
        }
    }

    function toggleAllPower() {
        const anyOn = lightsConfig.some(l => l.enabled);
        lightsConfig.forEach(l => l.enabled = !anyOn);
        saveState();
        renderLightCards();
        updateSimulation();
    }

    function updateGlobalPowerButtonUI() {
        const anyOn = lightsConfig.some(l => l.enabled);
        const btn = document.getElementById('global-power-btn');
        const text = document.getElementById('global-power-text');

        if (anyOn) {
            btn.className = "px-3 py-1.5 rounded-full bg-iosGreen/20 text-iosGreen text-xs font-semibold hover:bg-iosGreen/30 transition border border-iosGreen/30 flex items-center gap-1.5 active:scale-95";
            text.innerText = "All On";
        } else {
            btn.className = "px-3 py-1.5 rounded-full bg-iosRed/20 text-iosRed text-xs font-semibold hover:bg-iosRed/30 transition border border-iosRed/30 flex items-center gap-1.5 active:scale-95";
            text.innerText = "All Off";
        }
    }

    // Initialize application on load
    window.onload = function() {
        loadState();
        renderLightCards();
        updateSimulation();

        // Run ticker every 100ms for smooth live updates
        setInterval(updateSimulation, 100);
    };
</script>
</body>
</html>
